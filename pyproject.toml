[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "andrew-mlmdp"
version = "0.1.0"
description = "Readable research code for multitask LMDP maze navigation"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "matplotlib>=3.8",
    "numpy>=1.26",
    "scikit-learn>=1.5",
    "torch>=2.2",
]

[project.optional-dependencies]
notebook = [
    "ipympl>=0.9",
    "ipywidgets>=8.1",
    "jupyterlab>=4",
    "nbclient>=0.10",
    "nbformat>=5.10",
    "networkx>=3.3",
    "pandas>=2.2",
]
test = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.12",
    "vulture>=2.14",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I"]
