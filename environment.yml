name: hierarchical_bigmaze
channels:
  - conda-forge
dependencies:
  - python=3.12
  # Core library (src/andrew_mlmdp)
  - numpy>=2.0
  - pandas>=2.2
  - scipy>=1.14
  - scikit-learn>=1.5
  - networkx>=3.3
  - matplotlib>=3.9
  - plotly>=6.0,<7
  - python-kaleido>=0.2.1
  - pytorch>=2.2
  # Notebook / interactive plotting workflow
  - anywidget>=0.9
  - ipykernel>=6.29
  - ipython>=8
  - ipywidgets>=8.1
  - jupyterlab>=4.2
  - nbclient>=0.10
  - nbformat>=5.10
  # External Qin route-model sources (added to sys.path at runtime)
  - optuna>=4
  - tqdm>=4.67
  - tensorboard>=2.18
  - pymongo>=4.14
  - python-dotenv>=1.1
  - typing-extensions>=4.14
  # Tests and repository checks
  - pytest>=8
  - pytest-cov>=5
  - ruff>=0.12
  - vulture>=2.14
  - pip
  - pip:
      - -e .
